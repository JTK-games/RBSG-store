body { margin: 0px; line-height: inherit; }

a { color: inherit; text-decoration: inherit; }

b, strong { font-weight: bolder; }

sub { bottom: -0.25em; }

sup { top: -0.5em; }

button, select { text-transform: none; }

button, input:where([type="button"]), input:where([type="reset"]), input:where([type="submit"]) { appearance: button; background-color: transparent; background-image: none; }

<style>body{margin:0;background:#020617;color:#fff;font-family:ui-sans-serif,system-ui,sans-serif}
.rb-in{display:block;width:100%;background:rgba(30,41,59,.5);border:1px solid #475569;border-radius:.75rem;padding:.6rem .9rem;color:#fff;font-size:.9rem;box-sizing:border-box}
.rb-in:focus{outline:none;border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.rb-in::placeholder{color:#94a3b8} select.rb-in option{background:#0f172a}
.rb-card{background:linear-gradient(180deg,rgba(30,41,59,.5),rgba(15,23,42,.8));border:1px solid rgba(51,65,85,.6);border-radius:.9rem;padding:1rem}
.rb-msg{align-self:flex-start;max-width:85%;background:#1e293b;border:1px solid #334155;border-radius:.8rem;padding:.4rem .7rem}
.rb-msg.me{align-self:flex-end;background:#14532d;border-color:#166534}
.rb-rainbow{background:linear-gradient(90deg,#ff3b3b,#ffcc00,#3bff6e,#00ccff,#a64bff,#ff3b3b);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rbw 3s linear infinite}
@keyframes rbw{to{background-position:300% 0}}
#rb-toast{position:fixed;bottom:1.2rem;left:50%;transform:translate(-50%,20px);background:#0f172a;border:1px solid #22c55e;color:#fff;padding:.6rem 1.1rem;border-radius:.8rem;opacity:0;pointer-events:none;transition:.3s;z-index:9999;font-size:.9rem}
#rb-toast.show{opacity:1;transform:translate(-50%,0)}
#mmenu:not(.hidden){display:flex}
@media(min-width:768px){#mmenu{display:none!important}}
</style>

function mqConnect(cid, topics, onmsg, onstate) {
    let ws; try { ws = new WebSocket('wss://broker.emqx.io:8084/mqtt', 'mqtt'); } catch (e) { onstate(false); return; }
    ws.binaryType = 'arraybuffer'; MQ.ws = ws; let buf = new Uint8Array(0);
    ws.onopen = () => ws.send(pkt(0x10, [...enc('MQTT'), 4, 2, 0, 30, ...enc(cid)]));

        const n = new Uint8Array(e.data), m = new Uint8Array(buf.length + n.length); m.set(buf); m.set(n, buf.length); buf = m;

            if (buf.length < i + rl) return; const h = buf[0], type = h >> 4, body = buf.slice(i, i + rl); buf = buf.slice(i + rl);

        }

        document.getElementById('rb-cats').innerHTML = CATS.map(c => `<button onclick="R.cat='${c}';R.grid()" class="inline-flex items-center justify-center gap-2 whitespace-nowrap font-medium h-8 px-3 text-xs rounded-full transition-all duration-300 ${this.cat === c ? 'bg-green-600 hover:bg-green-700 text-white shadow-lg shadow-green-600/30' : 'border border-slate-600 text-slate-300 hover:bg-slate-800 hover:text-white hover:border-slate-500'}">${ic(CATI[c], 'w-4 h-4 mr-1.5')}${c}</button>`).join('');
    },
    net() {
        document.querySelectorAll('.net-dot').forEach(e => e.className = e.className.replace(/bg-(green|slate)-500/, NET.ok ? 'bg-green-500' : 'bg-slate-500'));
        const st = document.getElementById('rb-st'); if (st) st.innerHTML = NET.ok ? '<b class="text-green-400">● Conectado</b>' : '<b class="text-slate-400">○ Conectando…</b>';
        const o = document.getElementById('rb-online'); if (o) o.innerHTML = NET.ok ? `<b class="text-green-400">${online().length}</b> ${online().length === 1 ? 'jugador conectado' : 'jugadores conectados'} ahora en YEFREE${online().length ? ': ' + online().slice(0, 6).map(p => esc(p.name)).join(', ') : ''}.` : 'Conectando con el mundo de YEFREE…';
        if (this.page === 'friends') this.flist();
    },
    flist() { const L = document.getElementById('rb-flist'); if (!L) return; L.innerHTML = S.friends.length ? S.friends.map((f, i) => { const p = findOn(f); return `<div class="rb-card flex items-center gap-3"><div class="w-3 h-3 rounded-full ${p ? 'bg-green-500' : 'bg-slate-600'}"></div><div class="flex-1"><div class="font-bold">${esc(f)}</div><div class="text-xs text-slate-400">${p ? where(p) : 'Desconectado'}</div></div>${p ? `<button class="${BO}px-3 h-8 text-xs" onclick="R.to='${esc(f)}';location.hash='#/chat'">Chatear</button>` : ''}<button class="${BO}px-3 h-8 text-xs" onclick="R.delF(${i})">${ic('trash-2', 'w-3 h-3')}</button></div>`; }).join('') : '<p class="text-slate-400 text-sm">Aún no tienes amigos agregados.</p>'; },
    msgs() { const L = document.getElementById('rb-msgs'); if (!L) return; L.innerHTML = NET.msgs.length ? NET.msgs.map(m => `<div class="rb-msg ${m.me ? 'me' : ''}"><div class="text-xs font-bold">${m.badge && BT[m.badge] ? BT[m.badge][0] + ' ' : ''}<span style="color:${m.badge && BT[m.badge] && m.badge !== 'owner' ? BT[m.badge][2] : '#fbbf24'}" class="${m.badge === 'owner' ? 'rb-rainbow' : ''}">${esc(m.name)}</span>${m.priv ? ' <span class="text-pink-300 font-normal">(privado)</span>' : ''}</div><div class="text-sm break-words">${esc(m.text)}</div></div>`).join('') : '<p class="text-slate-500 text-sm">Aún no hay mensajes. ¡Saluda!</p>'; L.scrollTop = L.scrollHeight; },
    send() {
        const i = document.getElementById('rb-tx'), t = i.value.trim(); if (!t) return; if (!MQ.ok) { toast('Aún no hay conexión con el chat'); return; } if (Date.now() - NET.last < 800) return; NET.last = Date.now();
        const to = this.to.trim(); mqPub(T_CHAT, JSON.stringify({ id: NET.cid, name: myName(), text: t.slice(0, 120), badge: myBadge(), to })); NET.msgs.push({ name: myName(), text: t, badge: myBadge(), priv: !!to, me: true }); i.value = ''; this.msgs();
    },
    addF() { const i = document.getElementById('rb-fn'), n = i.value.trim().slice(0, 16); if (!n || S.friends.some(f => norm(f) === norm(n))) return; S.friends.push(n); save(); i.value = ''; this.flist(); },
    delF(i) { S.friends.splice(i, 1); save(); this.flist(); },
    impF() { const y = yLinked(); (y.d.friends || []).forEach(n => { if (!S.friends.some(f => norm(f) === norm(n))) S.friends.push(n); }); save(); this.flist(); toast('Amigos importados'); },
    play(id) { const g = S.games.find(x => x.id === id); if (!g) return; if (!g.url) { toast('Este juego aún no tiene enlace para jugar'); return; } g.plays = (g.plays || 0) + 1; save(); const u = g.yef ? g.url + (g.url.includes('?') ? '&' : '?') + 'from=rbsgstore' : g.url; if (g.yef || !/^https?:/i.test(u)) location.href = u; else window.open(u, '_blank', 'noopener'); },
    menu() { document.getElementById('mmenu').classList.toggle('hidden'); },
    saveName() { const n = document.getElementById('rb-pn').value.trim().slice(0, 16); if (!n) return; S.profile.name = n; save(); toast('Nombre guardado'); this.render(); },
    link(k) { S.profile.link = k; save(); this.render(); toast('Cuenta vinculada'); }, unlink() { S.profile.link = ''; save(); this.render(); },
    unlock() { const v = document.getElementById('rb-ap').value.trim(); if (cyrb53('yefree-owner:' + v).toString(36) === OWNER_HASH) { sessionStorage.setItem('rbsg_admin', '1'); this.render(); } else toast('Contraseña incorrecta'); },
    lock() { sessionStorage.removeItem('rbsg_admin'); this.edit = null; this.render(); },
    saveGame() {
        const v = id => document.getElementById(id).value.trim(), t = v('a-t'); if (!t) { toast('Falta el título'); return; }
        const fin = cover => { let g = this.edit && S.games.find(x => x.id === this.edit); if (!g) { g = { id: 'g' + Date.now().toString(36), plays: 0, cover: cover || COVER }; S.games.push(g); } if (cover) g.cover = cover; Object.assign(g, { title: t, short: v('a-s') || t, desc: v('a-d') || v('a-s'), cat: v('a-c'), tags: v('a-g').split(',').map(x => x.trim()).filter(Boolean), url: v('a-u'), featured: document.getElementById('a-x').checked }); if (g.featured) S.games.forEach(x => { if (x !== g) x.featured = false; }); save(); this.edit = null; this.render(); toast('Catálogo actualizado'); };
        const f = document.getElementById('a-f').files[0]; if (!f) return fin(null);
        const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, 800 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); fin(c.toDataURL('image/jpeg', .82)); }; im.src = r.result; }; r.readAsDataURL(f);
    },
    del(id) { if (!confirm('¿Eliminar este juego?')) return; S.games = S.games.filter(g => g.id !== id); save(); this.render(); },
    exp() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = 'rbsgstore-copia.json'; a.click(); },
    imp(inp) { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.games)) throw 0; S = d; S.friends = S.friends || []; S.profile = S.profile || { name: 'Jugador', link: '' }; save(); this.render(); toast('Copia importada'); } catch (e) { toast('Archivo no válido'); } }; r.readAsText(f); },
    reset() { if (!confirm('Esto borra tu catálogo y amigos de la tienda. ¿Continuar?')) return; S = DEF(); save(); this.render(); }
};
window.R = R; window.addEventListener('hashchange', () => R.render()); R.render();
})();
</script>
